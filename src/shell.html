<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b2b2b">
<title>Money Makes Money</title>
<meta name="description" content="You start with $30 million and it grows on its own. The town below pays for it, unless you spend it.">
<style>
:root{
  --bg:#e4dfd5;--paper:#f8f5ef;--ink:#1c1b18;--muted:#6b665c;--line:#d8d1c3;--panel:#fbf9f5;--dark:#2a2824;
  --green:#3c8a50;--green-soft:#e1efe2;--red:#b23a3a;--amber:#b7791f;--btn:#1c1b18;--btn-ink:#fff;
  --card:#fff;--shadow:0 1px 2px rgba(40,30,10,.06),0 4px 14px rgba(40,30,10,.07);--radius:14px;
  --cam-top:env(safe-area-inset-top,0px);--cam-left:env(safe-area-inset-left,0px);--cam-right:env(safe-area-inset-right,0px);--cam-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--dark);color:var(--ink);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,calc(125vw + 14px)) minmax(36vh,1fr);grid-template-columns:minmax(0,1fr);
  padding:var(--cam-top) var(--cam-right) 0 var(--cam-left);background:var(--bg)}
/* top bar */
#top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:8px 12px;background:var(--paper);border-bottom:1px solid var(--line)}
#fortune{display:flex;flex-direction:column;min-width:0}
#nw{font-size:24px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
#growth{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
#growth b{color:var(--green)}
#lad{border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px 10px 4px 26px;text-align:left;line-height:1.15;position:relative;min-width:0;max-width:46vw}
#lad::before{content:"";position:absolute;left:8px;top:7px;bottom:7px;width:10px;border-left:2px solid #888;border-right:2px solid #888;
  background:repeating-linear-gradient(#888 0 2px,transparent 2px 7px)}
#lad em{display:none;font-style:normal;font-weight:800;font-size:13px}
#lad b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#lad span{display:block;font-size:11px;color:var(--muted);white-space:nowrap}
#top{position:relative}#years{position:absolute;left:0;right:0;bottom:-1px;height:3px;background:transparent}#years i{display:block;height:100%;width:0;background:var(--green);transition:width .4s}
.toast.gold{background:#b58a14;font-weight:700}
#clock{font-size:13px;color:var(--muted);margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
#clock b{color:var(--ink);font-size:15px}
#speed{position:absolute;right:8px;top:8px;display:flex;gap:2px;background:rgba(236,236,236,.92);border:1px solid var(--line);border-radius:10px;padding:2px;z-index:2}
#speed button{border:0;background:transparent;border-radius:7px;min-width:36px;height:32px;font-weight:700;font-size:13px}
#speed button.on{background:var(--btn);color:var(--btn-ink)}
#meters{flex-basis:100%;display:grid;grid-template-columns:auto 1.4fr 1fr 1fr;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.meter b{display:block;color:var(--ink);font-size:13.5px;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:#d4d4d4;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;width:0;background:var(--amber);transition:width .4s}
/* map */
#mapwrap{position:relative;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation}
#toasts{position:absolute;left:10px;right:10px;bottom:10px;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
.toast{background:rgba(21,21,21,.86);color:#fff;font-size:13px;padding:5px 10px;border-radius:14px;max-width:100%;animation:fade 4.5s forwards}
@keyframes fade{0%{opacity:0;transform:translateY(-4px)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:12.5px;
  box-shadow:0 4px 14px rgba(0,0,0,.15);display:none;max-width:220px}
#tip b{font-size:13.5px}
/* bottom sheet */
#sheet{background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding-bottom:var(--cam-bottom)}
#tabs{display:flex;border-bottom:1px solid var(--line)}
#tabs button{flex:1;border:0;background:transparent;padding:10px 4px;font-weight:700;font-size:13.5px;color:var(--muted);border-bottom:3px solid transparent}
#tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
#pane{overflow:auto;padding:10px 12px 14px;-webkit-overflow-scrolling:touch}
.lead{font-size:13px;color:var(--muted);margin:0 0 10px}
.card{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:8px}
.card .txt{flex:1;min-width:0}
.card b{display:block;font-size:14.5px}
.card small{display:block;color:var(--muted);font-size:12.5px}
.card small.real{color:#7a7a7a;font-style:italic}
.act{border:0;background:var(--btn);color:var(--btn-ink);border-radius:10px;padding:9px 12px;font-weight:700;font-size:13px;white-space:nowrap;min-height:40px}
.act:disabled{background:#cfcfcf;color:#777;cursor:default}
.toggle{width:52px;height:30px;border-radius:15px;border:0;background:#cfcfcf;position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on{background:var(--green)}.toggle.on::after{left:25px}
.sum{font-size:13px;padding:8px 10px;background:var(--green-soft);border-radius:10px;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;font-size:12px;margin-bottom:10px}
.stats div{display:flex;flex-direction:column;gap:1px;background:var(--card);border:1px solid #e9e2d5;border-radius:12px;padding:8px 10px;color:var(--muted);line-height:1.25}
.stats div:empty{display:none}
.stats b{font-variant-numeric:tabular-nums;color:var(--ink);font-size:16px;letter-spacing:-.01em}
#chart{width:100%;height:170px;display:block}
.decide .kicker{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.decide h3{margin:2px 0 4px;font-size:18px;letter-spacing:-.01em}
.decide p{margin:0 0 10px;font-size:13.5px;color:#333}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.opt b{font-size:15px}.opt em{font-style:normal;font-size:11px;font-weight:800;color:#fff;background:#6d6d6d;border-radius:6px;padding:2px 6px;margin-left:8px;vertical-align:2px}
.opt span{display:flex;gap:8px;font-size:12.5px;color:#444;margin-top:3px}.opt span i{font-style:normal;font-weight:800;color:var(--muted);min-width:38px}
.opt:hover{border-color:#888}
#sheet.deciding{box-shadow:0 -6px 18px rgba(0,0,0,.18)}#sheet.deciding #tabs{opacity:.4}
.rare{display:inline-block;font-size:11px;font-weight:800;color:#fff;background:#4c9a5d;border-radius:6px;padding:2px 6px;margin-left:8px;vertical-align:3px}
.ach{padding:6px 0;border-bottom:1px solid #e2e2e2;font-size:13px}.ach small{display:block;color:var(--muted);font-size:11.5px}.ach-new{background:#eef6ef;margin:8px 0;padding:8px 10px;border-radius:8px;font-size:13px}
#box .achlist{max-height:55vh;overflow:auto;margin:6px 0 10px}
.story{border-bottom:1px solid #e2e2e2;padding:7px 0;font-size:13px}.story small{display:block;color:var(--muted);font-size:11.5px}.story span{display:block;color:#333}
.seg{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:48px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 4px;font-weight:700;font-size:13px}
.seg button.on{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
/* the ladder of achievements */
#box.wide{max-width:560px}
.ladhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}.score{font-size:13px;color:var(--muted)}.score b{font-size:18px;color:var(--ink)}
.bar.big{height:8px;margin:2px 0 12px}.bar.big i{background:var(--green)}
.ladder{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 14px}
.ladder .side{position:relative;display:flex;flex-direction:column;gap:7px;padding:0 10px 4px}
.ladder .side::before,.ladder .side::after{content:"";position:absolute;top:22px;bottom:-14px;width:5px;border-radius:3px;background:#9b9b9b}
.ladder .side::before{left:0}.ladder .side::after{right:0}
.cap{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:2px 0 4px;text-align:center}
.foot{grid-column:1/3;padding:0 22%}
.rung{position:relative;display:block;width:100%;text-align:left;border:0;border-radius:8px;background:#fff;padding:7px 8px 6px;box-shadow:0 1px 0 #bdbdbd,inset 0 0 0 1px #d5d5d5;z-index:1}
.rung .rn{display:block;font-weight:800;font-size:12.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:26px}
.rung .cnt{position:absolute;right:7px;top:7px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.rung .notches{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.rung .notches i{width:12px;height:12px;border-radius:50%;border:2px solid #b9b9b9;background:transparent}
.rung .notches i.on{background:var(--green);border-color:var(--green)}
.rung .notches i.gold{border-radius:3px;transform:rotate(45deg) scale(.85);border-color:#d0b26a}.rung .notches i.gold.on{background:#d4a72c;border-color:#b58a14}
.rung.here{box-shadow:0 0 0 2px var(--ink)}.rung .you{position:absolute;left:-6px;top:-7px;background:var(--ink);color:#fff;font-size:9.5px;font-weight:800;border-radius:6px;padding:1px 5px}
.rung.unknown{background:#e6e6e6}.rung.unknown .rn{color:#8a8a8a;letter-spacing:.2em}
.rung.sel{outline:2px solid var(--green);outline-offset:1px}
.ldetail{margin:14px 0 8px;padding:10px 12px;background:#fff;border-radius:12px;border:1px solid #d5d5d5;font-size:13px;min-height:62px}
.ldetail .found{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}.ldetail small{display:block;color:var(--muted);font-size:12px}.ldetail small.note{color:#8a6a10;margin-top:3px}
.endnotches{display:flex;align-items:center;gap:10px;margin:8px 0 2px}.endnotches small{color:var(--muted);font-size:12px}
.endnotches .notches{display:flex;gap:4px}.endnotches .notches i,.rung .notches i{width:12px;height:12px;border-radius:50%;border:2px solid #b9b9b9}
.endnotches .notches i.on{background:var(--green);border-color:var(--green)}.endnotches .notches i.gold{border-radius:3px;transform:rotate(45deg) scale(.85);border-color:#d0b26a}.endnotches .notches i.gold.on{background:#d4a72c;border-color:#b58a14}
.pill{background:var(--green-soft);color:#24502f;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700}.pill.gold{background:#f6ead0;color:#7a5a0a}
.medals{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:2px 0 4px}
.medal{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;font-size:10.5px;color:#8a8a8a;line-height:1.2}
.medal i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;background:#e2e2e2;border:2px dashed #b9b9b9;color:#9a9a9a}
.medal.on{color:var(--ink)}.medal.on i{background:#d4a72c;border:2px solid #b58a14;color:#fff}
@media (max-width:380px){#box.wide{padding:14px 12px 12px}.ladder{gap:8px}.ladder .side{padding:0 7px 4px}.rung{padding:6px 6px 5px}.rung .rn{font-size:11.5px;padding-right:22px}.rung .notches{gap:3px}.rung .notches i{width:10px;height:10px}.foot{padding:0 18%}.cap{font-size:10px}.medal{font-size:9.5px}.medal i{width:28px;height:28px}}
/* modal */
#modal{position:fixed;inset:0;background:rgba(20,20,20,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
#modal.show{display:flex}
#modal.low{align-items:flex-end;background:rgba(20,20,20,.25)}#modal.low #box{max-height:62vh}
#box{background:var(--panel);border-radius:16px;max-width:430px;width:100%;padding:18px 18px 14px;box-shadow:0 10px 40px rgba(0,0,0,.35);max-height:90vh;overflow:auto}
#box h2{margin:0 0 6px;font-size:21px;letter-spacing:-.01em}
#box p{margin:0 0 10px;font-size:14px}
#box .big{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:6px 0}
#box .opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
#box .opts button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px}
#box .opts button b{display:block;font-size:14.5px}
#box .opts button small{color:var(--muted);font-size:12.5px}
#box .opts button.main{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
#box .opts button.main small{color:#ccc}
/* ---------- polish ---------- */
#growth,#clock b,.meter b,.meter{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fortune{min-width:0;flex:1}.meter{min-width:0}
body{-webkit-font-smoothing:antialiased}
#app{background:radial-gradient(120% 80% at 50% 0%,#efeae1 0%,var(--bg) 70%)}
#top{background:var(--paper);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(40,30,10,.06);z-index:2}
#nw{font-size:26px;letter-spacing:-.025em}
.meter{line-height:1.25}.meter b{font-size:14px}
.bar{background:#e6e0d4;height:5px}
#lad{background:var(--card);border-color:var(--line);box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s}
#lad:hover{box-shadow:0 2px 6px rgba(40,30,10,.12),0 8px 20px rgba(40,30,10,.1)}
#speed{background:rgba(251,249,245,.94);border-color:var(--line);box-shadow:var(--shadow);border-radius:12px;backdrop-filter:blur(6px)}
#speed button{transition:background .15s,color .15s}
/* the sheet and its tabs */
#sheet{background:var(--panel);border-color:var(--line)}
#tabs{gap:4px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--paper)}
#tabs button{border:0;border-radius:10px;padding:8px 6px;color:var(--muted);transition:background .15s,color .15s}
#tabs button.on{background:var(--ink);color:#fff;border-bottom:0}
#tabs button:not(.on):hover{background:#efe9de}
#pane{padding:12px 14px 16px}
#pane.fresh>*{animation:rise .22s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{border-color:var(--line);border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow)}
.act{border-radius:11px;transition:transform .1s,filter .15s}.act:hover{filter:brightness(1.25)}
button:active{transform:scale(.98)}
.toggle{transition:background .2s}
.sum{background:var(--green-soft)}
/* the decision card, dealt in */
.decide{animation:deal .32s cubic-bezier(.2,.8,.2,1)}
@keyframes deal{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
.decide .kicker{display:inline-flex;align-items:center;gap:6px;color:var(--amber)}
.decide .kicker::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--amber);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.decide h3{font-size:19px}
.opt{border-color:var(--line);border-radius:var(--radius);box-shadow:var(--shadow);transition:transform .12s,box-shadow .15s,border-color .15s;padding:12px 14px}
.opt:hover{border-color:#a99f8c;box-shadow:0 2px 6px rgba(40,30,10,.1),0 10px 24px rgba(40,30,10,.1);transform:translateY(-1px)}
.opt em{background:var(--amber)}
.opt span{margin-top:5px}.opt span i{display:inline-block;min-width:44px;text-align:center;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:1px 6px;height:18px;line-height:16px}
.opt span:nth-of-type(1) i{background:#ece7dd;color:#4d483f}.opt span:nth-of-type(2) i{background:var(--green-soft);color:#2d5f39}
#sheet.deciding{box-shadow:0 -8px 24px rgba(40,30,10,.18)}
.tip{display:flex;gap:8px;align-items:flex-start;background:#fdf6e6;border:1px solid #ecd9a6;border-radius:12px;padding:8px 10px;font-size:12.5px;color:#5e4a14;margin:0 0 10px}
.tip b{font-size:12.5px}
/* modals */
#modal{background:rgba(28,24,18,.5);backdrop-filter:blur(3px)}
#modal.show #box{animation:pop .28s cubic-bezier(.2,.9,.25,1.1)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
#box{background:var(--panel);border-radius:20px;box-shadow:0 18px 60px rgba(20,14,4,.35)}
#box .opts button{border-color:var(--line);border-radius:var(--radius);box-shadow:var(--shadow);transition:transform .12s,box-shadow .15s}
#box .opts button:hover{box-shadow:0 2px 6px rgba(40,30,10,.12),0 10px 24px rgba(40,30,10,.12)}
.toast{background:rgba(28,24,18,.9);box-shadow:0 6px 18px rgba(0,0,0,.2);border-radius:999px;padding:6px 14px}
/* on devices with a mouse, each option shows the key that picks it */
.decide{counter-reset:opt}.opt{position:relative;counter-increment:opt}
@media (hover:hover) and (pointer:fine){.opt::after{content:counter(opt);position:absolute;right:12px;top:12px;width:20px;height:20px;border-radius:6px;border:1px solid var(--line);
  color:var(--muted);font-size:11px;font-weight:800;display:grid;place-items:center;background:#faf7f1}}
/* endings */
#box .kick{display:block;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
#box.ending h2{font-size:26px;letter-spacing:-.025em}
#box.ending .big{color:var(--green)}
/* the first screen */
#box .hero small{display:block;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
#box .hero h2{font-size:28px;letter-spacing:-.03em;margin:2px 0 12px}
.steps{display:flex;flex-direction:column;gap:12px;margin:4px 0 6px}
.step{display:flex;gap:12px;align-items:flex-start;animation:rise .35s ease-out both}
.step:nth-child(2){animation-delay:.08s}.step:nth-child(3){animation-delay:.16s}.step:nth-child(4){animation-delay:.24s}
.step b{display:block;font-size:15px}.step span{display:block;font-size:13.5px;color:#4d483f;line-height:1.35}
.ico{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#efe9de}
.ico svg{width:28px;height:28px;fill:var(--ink)}.ico.town{background:var(--green-soft)}.ico.town svg{fill:#2d5f39}.ico.card{background:#fdf1d8}.ico.card svg{fill:var(--amber)}
#meters{max-width:780px}
/* paused: the play button glows until you press it */
#speed.paused::before{content:"Paused";align-self:center;font-size:11px;font-weight:800;color:var(--amber);padding:0 6px 0 8px;letter-spacing:.04em;text-transform:uppercase}
#speed.paused button[data-s="1"]{background:var(--amber);color:#fff;animation:invite 1.6s ease-in-out infinite}
@keyframes invite{50%{box-shadow:0 0 0 5px rgba(183,121,31,.25)}}
:focus-visible{outline:3px solid #d4a72c;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* wide and landscape screens: the panel moves to the right of the map */
@media (min-width:900px),(orientation:landscape) and (max-height:560px){
  #app{grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr) minmax(300px,380px)}
  #top{grid-column:1/3}
  #sheet{grid-row:2;grid-column:2;max-height:none;border-top:0;border-left:1px solid var(--line);min-height:0}
  #meters{flex-basis:auto;flex:1;min-width:300px;order:2}
  #clock{order:3}
}
@media (orientation:landscape) and (max-height:560px){
  #top{padding:4px 10px;gap:4px 10px}#nw{font-size:19px}#meters{font-size:11px}
  #app{grid-template-columns:minmax(0,1fr) minmax(260px,320px)}
}
@media (max-width:420px){#speed button{min-width:28px;height:26px;font-size:12px}#speed.paused::before{display:none}}
/* phones held upright: a compact ladder chip, and more of the screen for a decision while one is waiting */
